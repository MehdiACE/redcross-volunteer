<div class="sidebar-backdrop" *ngIf="isOpen" (click)="onBackdropClick()"></div>

<aside 
  class="sidebar" 
  [class.open]="isOpen"
  role="navigation"
  aria-label="Main navigation">
  
  <!-- Header -->
  <div class="sidebar-header">
    <img src="assets/images/logoCRF.svg" alt="Croix-Rouge française" class="logo" />
    <button 
      class="close-btn"
      (click)="closeSidebar()"
      aria-label="Close sidebar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- User Info -->
  <div class="user-info">
    <div class="user-avatar">
      {{ userInitials }}
    </div>
    <div class="user-details">
      <p class="user-name">{{ userName }}</p>
      <p class="user-role">{{ userRole }}</p>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="menu">
    <ul class="menu-list">
      <li *ngFor="let item of menuItems" class="menu-item">
        <button 
          class="menu-link"
          (click)="navigateTo(item.route)"
          [attr.aria-label]="item.label">
          <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
          <span class="menu-label">{{ item.translationKey | translate }}</span>
          <span *ngIf="item.badge && item.badge > 0" class="badge">
            {{ item.badge }}
          </span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button class="footer-link">
      <mat-icon>dark_mode</mat-icon>
      <span>Mode sombre</span>
    </button>
    <button class="footer-link">
      <mat-icon>settings</mat-icon>
      <span>Paramètres</span>
    </button>
  </div>
</aside>
