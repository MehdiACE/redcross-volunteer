<div class="min-h-screen bg-app-bg flex flex-col">
  <header class="w-full px-4 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img
          src="assets/images/logoCRF.svg"
          alt="Croix-Rouge française"
          class="md:h-24 md:w-48 h-12 w-24"
        />
      </div>
      <button
        mat-icon-button
        type="button"
        class="h-10 w-10 rounded-full bg-white border border-rose-100 text-rose-600 shadow-sm"
      >
        <mat-icon>language</mat-icon>
      </button>
    </div>
  </header>

  <main class="px-4 pb-12">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center">
      <div class="flex flex-col items-center lg:items-start text-center lg:text-left">
        <img
          src="assets/illustrations/volunteer-hero.svg"
          alt="Volunteer illustration"
          class="w-full max-w-sm md:max-w-md lg:max-w-lg rounded-2xl shadow-sm mb-6"
        />
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">
          {{ 'login.title' | translate }}
        </h1>
        <p class="text-gray-600 max-w-md">
          {{ 'login.subtitle' | translate }}
        </p>
      </div>

      <div class="flex justify-center">
        <div class="w-full max-w-sm md:max-w-md lg:max-w-lg bg-white rounded-2xl shadow-lg p-5 md:p-8">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
            <mat-form-field class="w-full">
              <mat-label>{{ 'login.fields.email' | translate }}</mat-label>
              <input matInput type="email" formControlName="email" required autocomplete="email">
              <mat-icon matPrefix>email</mat-icon>
              <mat-error>{{ getErrorMessage('email') }}</mat-error>
            </mat-form-field>

            <div class="space-y-2">
              <mat-form-field class="w-full">
                <mat-label>{{ 'login.fields.password' | translate }}</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required autocomplete="current-password">
                <mat-icon matPrefix>lock</mat-icon>
                <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword" type="button">
                  <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error>{{ getErrorMessage('password') }}</mat-error>
              </mat-form-field>
              <div class="text-right">
                <a class="text-sm text-rose-600 hover:text-rose-700" href="#">
                  Mot de passe oublié ?
                </a>
              </div>
            </div>

            <button
              mat-raised-button
              type="submit"
              class="w-full h-12 text-base bg-red-600 hover:bg-red-700 text-white"
              [disabled]="isLoading || loginForm.invalid">
              <mat-spinner *ngIf="isLoading" diameter="20" class="inline-block mr-2"></mat-spinner>
              <span *ngIf="!isLoading">{{ 'login.submit' | translate }}</span>
              <span *ngIf="isLoading">{{ 'common.loading' | translate }}</span>
            </button>

            <div class="flex items-center gap-4 text-gray-400 text-sm">
              <div class="h-px flex-1 bg-gray-200"></div>
              <span>OU</span>
              <div class="h-px flex-1 bg-gray-200"></div>
            </div>

            <button
              mat-stroked-button
              type="button"
              routerLink="/register"
              class="w-full h-12 text-base border border-red-600 text-red-600 hover:bg-red-50">
              {{ 'login.register' | translate }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
