<div class="min-h-screen bg-app-bg dark:bg-app-bg-dark flex flex-col">
  <header class="w-full px-4 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img
          src="assets/images/logoCRF.svg"
          alt="Croix-Rouge française"
          class="md:h-24 md:w-48 h-12 w-24"
        />
      </div>
      <div class="flex items-center gap-2">
        <button
          mat-icon-button
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="isDarkMode ? 'Passer en mode clair' : 'Passer en mode sombre'"
          class="icon-btn h-10 w-10 rounded-full bg-white dark:bg-slate-800 border border-rose-100 dark:border-slate-700 text-rose-600 dark:text-rose-200 shadow-sm"
        >
          <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          (click)="toggleLanguage()"
          [attr.aria-label]="currentLang === 'fr' ? 'Passer en anglais' : 'Switch to French'"
          class="icon-btn h-10 w-10 rounded-full bg-white dark:bg-slate-800 border border-rose-100 dark:border-slate-700 text-rose-600 dark:text-rose-200 shadow-sm relative"
        >
          <mat-icon>language</mat-icon>
          <span
            class="absolute -bottom-1 -right-1 text-[10px] font-semibold bg-white dark:bg-slate-800 text-rose-600 dark:text-rose-200 px-1 rounded"
          >
            {{ currentLang.toUpperCase() }}
          </span>
        </button>
      </div>
    </div>
  </header>

  <main class="px-4 pb-12">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center">
      <div class="flex flex-col items-center lg:items-start text-center lg:text-left">
        <img
          src="assets/illustrations/volunteer-hero.svg"
          alt="Volunteer illustration"
          class="w-full max-w-sm md:max-w-md lg:max-w-lg rounded-2xl shadow-sm mb-6"
        />
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">
          {{ 'login.title' | translate }}
        </h1>
        <p class="text-gray-600 max-w-md">
          {{ 'login.subtitle' | translate }}
        </p>
      </div>

      <div class="flex justify-center">
        <div
          class="w-full max-w-sm md:max-w-md lg:max-w-lg bg-white dark:bg-slate-800/70 dark:border dark:border-slate-700 dark:shadow-none rounded-2xl shadow-lg p-5 md:p-8"
        >
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
            <mat-form-field class="w-full">
              <mat-label>{{ 'login.fields.email' | translate }}</mat-label>
              <input
                matInput
                type="email"
                formControlName="email"
                required
                autocomplete="email"
                [placeholder]="'login.fields.email' | translate"
              />
              <mat-icon matPrefix>email</mat-icon>
              <mat-error>{{ getErrorMessage('email') }}</mat-error>
            </mat-form-field>

            <div class="space-y-2">
              <mat-form-field class="w-full">
                <mat-label>{{ 'login.fields.password' | translate }}</mat-label>
                <input
                  matInput
                  [type]="hidePassword ? 'password' : 'text'"
                  formControlName="password"
                  required
                  autocomplete="current-password"
                  [placeholder]="'login.fields.password' | translate"
                />
                <mat-icon matPrefix>lock</mat-icon>
                <button
                  mat-icon-button
                  matSuffix
                  (click)="hidePassword = !hidePassword"
                  [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hidePassword"
                  type="button"
                >
                  <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error>{{ getErrorMessage('password') }}</mat-error>
              </mat-form-field>
              <div class="text-right">
                <a class="text-sm text-rose-600 hover:text-rose-700" href="#">
                  Mot de passe oublié ?
                </a>
              </div>
            </div>

            <button
              mat-raised-button
              type="submit"
              class="w-full h-12 text-base bg-red-600 text-white hover:bg-red-700 border border-red-600 login-submit"
              [disabled]="isLoading || loginForm.invalid"
            >
              <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
                <mat-spinner diameter="20" class="inline-block shrink-0"></mat-spinner>
                <span>{{ 'common.loading' | translate }}</span>
              </span>
              <span *ngIf="!isLoading">{{ 'login.submit' | translate }}</span>
            </button>

            <div class="flex items-center gap-4 text-gray-400 text-sm">
              <div class="h-px flex-1 bg-gray-200"></div>
              <span>OU</span>
              <div class="h-px flex-1 bg-gray-200"></div>
            </div>

            <button
              mat-stroked-button
              type="button"
              routerLink="/register"
              class="w-full h-12 text-base border border-red-600 text-red-600 hover:bg-red-50"
            >
              {{ 'login.register' | translate }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
