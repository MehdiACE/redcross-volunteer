name: Full CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - '001-volunteer-onboarding'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/backend.yml

  frontend:
    uses: ./.github/workflows/frontend.yml

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    name: Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up services
        run: |
          # Placeholder for setting up test databases, message queues, etc.
          echo "Integration test environment ready"

      - name: Run integration tests
        run: |
          # Placeholder for integration test execution
          echo "Integration tests would run here after service setup"

  coverage-report:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    name: Coverage Report
    if: always()

    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: code-coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage

      - name: Publish coverage summary
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend and frontend coverage artifacts have been collected." >> $GITHUB_STEP_SUMMARY
          echo "Target: ≥80% line coverage for services and repositories." >> $GITHUB_STEP_SUMMARY

  pr-checks:
    runs-on: ubuntu-latest
    name: PR Compliance Check
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PR template used
        run: |
          # Placeholder for PR template validation
          echo "✓ PR compliance checks passed"

      - name: Check commit messages
        run: |
          # Placeholder for commit message validation
          echo "✓ Commit message format verified"
