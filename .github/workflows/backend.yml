name: Backend CI

on:
  workflow_call:
  push:
    branches:
      - main
      - develop
      - '001-volunteer-onboarding'
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test (.NET)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Run unit tests
        run: dotnet test RedCrossManager.Server.Tests/RedCrossManager.Server.Tests.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" -- RunConfiguration.DisableAppDomain=true

      - name: Check code coverage
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:**/coverage.cobertura.xml -targetdir:./coverage-report -reporttypes:"Cobertura;TextSummary"
          
          echo "=== Coverage Summary ==="
          cat ./coverage-report/Summary.txt
          
          # Extract line coverage percentage from the Cobertura XML
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' ./coverage-report/Cobertura.xml | head -1)
          COVERAGE=$(awk "BEGIN {printf \"%.1f\", $LINE_RATE * 100}")
          echo "Line coverage: $COVERAGE%"
          
          # Fail if coverage is below 80%
          awk "BEGIN {exit ($COVERAGE < 80 ? 1 : 0)}" || {
            echo "❌ Coverage ($COVERAGE%) is below the required 80% threshold"
            exit 1
          }
          echo "✅ Coverage ($COVERAGE%) meets the required 80% threshold"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: '**/coverage.cobertura.xml'

  lint:
    runs-on: ubuntu-latest
    name: Code Quality (StyleCop)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Check code style with StyleCop
        run: |
          dotnet restore
          dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }} /p:EnforceCodeStyleInBuild=true

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable
        continue-on-error: true
