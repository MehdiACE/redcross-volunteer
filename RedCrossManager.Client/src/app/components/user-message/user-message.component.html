<div class="relative">
  <button
    type="button"
    (click)="toggleMessageMenu()"
    class="relative flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 dark:border-text-dark dark:text-[#F5F5F0] dark:hover:bg-gray-800"
    aria-label="{{ 'header.messages' | translate }}"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z" />
    </svg>
    <span *ngIf="unreadCount > 0" class="absolute -top-1 -right-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-semibold text-white">
      {{ unreadCount }}
    </span>
  </button>

  <div *ngIf="showMessageMenu" class="absolute right-0 mt-3 w-96 rounded-2xl border border-gray-200 bg-white shadow-xl dark:bg-[#15161b] dark:border-text-dark">
    <div class="px-5 pt-5 pb-3 flex items-center justify-between">
      <span class="text-sm font-semibold text-gray-900 dark:text-[#F5F5F0]">
        {{ 'header.recentMessages' | translate }}
      </span>
      <span *ngIf="unreadCount > 0" class="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-semibold text-rose-600 dark:bg-rose-500/20 dark:text-rose-200">
        {{ 'header.unreadBadge' | translate:{count: unreadCount} }}
      </span>
    </div>

    <div *ngIf="recentMessages.length === 0" class="px-5 pb-3 text-sm text-gray-500 dark:text-gray-400">
      {{ 'header.noRecentMessages' | translate }}
    </div>

    <button
      *ngFor="let message of recentMessages"
      type="button"
      (click)="openMessageDrawer('read', message)"
      class="w-full text-left px-5 py-3 border-t border-gray-100 hover:bg-gray-50 dark:border-text-dark dark:hover:bg-gray-800">
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold text-gray-900 dark:text-[#F5F5F0]">
          {{ message.fromUserName }}
        </span>
        <span class="text-xs text-gray-400">
          {{ message.createdAt | date:'short' }}
        </span>
      </div>
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400 line-clamp-1">
        {{ message.content }}
      </p>
    </button>

    <div class="px-5 pt-4 pb-5 border-t border-gray-100 dark:border-text-dark">
      <button
        type="button"
        (click)="openMessageDrawer('compose')"
        class="w-full rounded-xl bg-rose-600 px-4 py-3 text-sm font-semibold text-white hover:bg-rose-700">
        + {{ 'header.newMessage' | translate }}
      </button>
      <button
        type="button"
        (click)="openMessageDrawer('read', recentMessages[0])"
        class="mt-3 w-full text-center text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
        {{ 'header.viewAllNotifications' | translate }}
      </button>
    </div>
  </div>
</div>

<div *ngIf="showMessageDrawer" class="fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/40" (click)="closeMessageDrawer()"></div>
  <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white dark:bg-[#191a1f] p-6 shadow-xl overflow-y-auto">
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-[#F5F5F0]">
        {{ drawerMode === 'read' ? ('header.readMessage' | translate) : ('header.composeMessage' | translate) }}
      </h2>
      <button type="button" (click)="closeMessageDrawer()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
        ✕
      </button>
    </div>

    <app-read-message
      *ngIf="drawerMode === 'read'"
      [message]="selectedMessage"
    ></app-read-message>

    <app-compose-message
      *ngIf="drawerMode === 'compose'"
      [isAdmin]="isAdmin"
      [volunteers]="filteredComposeVolunteers"
      [composeContent]="composeContent"
      [composeVolunteerSearch]="composeVolunteerSearch"
      [composeVolunteerId]="composeVolunteerId"
      [adminTargetUserId]="adminTargetUserId"
      (composeContentChange)="onComposeContentChange($event)"
      (composeVolunteerSearchChange)="onComposeVolunteerSearchChange($event)"
      (volunteerSelected)="onVolunteerComposeSelected($event)"
      (send)="sendDrawerMessage()"
    ></app-compose-message>
  </div>
</div>
