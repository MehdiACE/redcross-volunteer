<div class="mt-6" *ngIf="message; else noMessage">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm font-semibold text-gray-900 dark:text-[#F5F5F0]">
        {{ message.fromUserName }}
      </p>
      <p class="text-xs text-gray-500 dark:text-gray-400">
        {{ message.createdAt | date:'medium' }}
      </p>
    </div>
    <span *ngIf="!message.isRead" class="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-semibold text-rose-600 dark:bg-rose-500/20 dark:text-rose-200">
      {{ 'header.unreadLabel' | translate }}
    </span>
  </div>

  <div class="mt-4 rounded-xl border border-gray-100 bg-gray-50 p-4 text-sm text-gray-700 dark:border-text-dark dark:bg-[#111216] dark:text-gray-200">
    {{ message.content }}
  </div>
</div>

<ng-template #noMessage>
  <div class="mt-6 text-sm text-gray-500 dark:text-gray-400">
    {{ 'header.noMessageSelected' | translate }}
  </div>
</ng-template>
